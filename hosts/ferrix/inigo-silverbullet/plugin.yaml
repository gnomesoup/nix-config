name: inigo-silverbullet
version: 0.1.0
manifest_version: 2
api_version: 1
description: Direct, conflict-aware SilverBullet HTTP tools for Inigo
license: MIT
tags: [silverbullet, notes, knowledge]
provides_tools:
  - silverbullet_list_pages
  - silverbullet_search
  - silverbullet_read
  - silverbullet_create
  - silverbullet_update
  - silverbullet_append
  - silverbullet_move
  - silverbullet_soft_delete
config_schema:
  base_url:
    type: str
    default: http://127.0.0.1:3000
    description: SilverBullet HTTP origin without a path
  allow_insecure_http:
    type: bool
    default: false
    description: Permit plain HTTP for a trusted loopback endpoint
  token_file:
    type: str
    description: Absolute token path; defaults to the systemd credential directory when omitted
  default_space:
    type: str
    default: personal
    description: Default configured space name
  spaces:
    type: dict
    description: Allowed space names, URL prefixes, labels, and read/write path allowlists
  max_content_bytes:
    type: int
    default: 2097152
    description: Maximum bytes read from or written to one page
  max_search_bytes:
    type: int
    default: 67108864
    description: Maximum page bytes scanned by one search
  max_result_chars:
    type: int
    default: 50000
    description: Maximum characters returned by one tool call
